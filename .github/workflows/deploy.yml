name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (main)
        run: npm ci

      - name: Build main site
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Install dependencies (Russian)
        run: npm ci
        working-directory: upgradepc-ru

      - name: Build Russian site
        run: npm run build
        working-directory: upgradepc-ru
        env:
          GITHUB_PAGES: true

      - name: Merge sites
        run: |
          mkdir -p dist/ru
          cp -r upgradepc-ru/dist/* dist/ru/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
